<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Fashion Hub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="logo">FASHION<span>HUB</span></div>

    <nav>
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<section class="contact-section">

    <div class="contact-info">

        <p class="small-text">GET IN TOUCH</p>

        <h1>
            Let's Talk <br>
            Fashion
        </h1>

        <p class="contact-desc">
            Have questions about our collections,
            collaborations, or luxury styling?
            Our team is always ready to assist you.
        </p>

        <div class="contact-details">
            <p>Email: support@fashionhub.com</p>
            <p>Phone: +92XXXXXXXXXX</p>
            <p>Location: :Islamabad, Pakistan
            </p>
        </div>

    </div>

    <div class="contact-form">

        <input type="text" placeholder="Your Name">

        <input type="email" placeholder="Your Email">

        <textarea placeholder="Your Message"></textarea>

        <button>Send Message</button>

    </div>

</section>

<footer>
    <p>© 2026 Fashion Hub Studio</p>
</footer>
